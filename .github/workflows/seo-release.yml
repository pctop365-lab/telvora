name: SEO Release (build only)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 * * * *' # Proposal only; intentionally disabled in Phase 1.

permissions:
  contents: read

jobs:
  seo-build:
    name: Build and validate SEO release (no deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build SEO release from public read-only APIs
        run: npm run build:seo

      - name: Validate generated release
        run: |
          npm run test:seo:raw
          npm run test:seo:physical
          npm run test:seo:htaccess
          node tests/seo_contract_test.mjs
          node tests/seo_release_report_test.mjs

      - name: Install Chromium for hydration checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: npx playwright install --with-deps chromium

      - name: Run SEO hydration/browser checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: >-
          npx playwright test --config=playwright.seo.config.ts
          tests/seo-browser/prerender.spec.ts
          --grep "refresh, hydration|HTTP route contract|fresh API price|active product remains indexable"

      - name: Generate release report
        run: npm run seo:report

      - name: Fail on obvious secret or private-config material
        shell: bash
        run: |
          set -euo pipefail
          if find dist deployment/seo-stage2 seo-artifacts -type f \( -name '.env' -o -name 'telvora_secrets.php' -o -name '*credential*' -o -name '*private*' \) -print -quit | grep -q .; then
            echo 'Forbidden secret/private file found in release inputs' >&2
            exit 1
          fi
          if rg -n -i --glob '!*.map' 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|DB_PASSWORD|TELEGRAM_BOT_TOKEN|AWS_SECRET_ACCESS_KEY' dist deployment/seo-stage2 seo-artifacts; then
            echo 'Obvious secret material found in release inputs' >&2
            exit 1
          fi

      - name: Upload immutable SEO artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: telvora-seo-release-${{ github.sha }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/
            deployment/seo-stage2/production.htaccess.final
            deployment/seo-stage2/pre-activation-layout-check.sh
            seo-artifacts/routes.json
            seo-artifacts/routes.nginx.conf
            seo-artifacts/routes.apache.conf
            seo-artifacts/release-inventory.json
            seo-artifacts/seo-release-report.json
