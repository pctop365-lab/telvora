name: SEO Release (build only)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 * * * *' # Proposal only; intentionally disabled in Phase 1.

permissions:
  contents: read

jobs:
  seo-build:
    name: Build and validate SEO release (no deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build SEO release from public read-only APIs
        run: npm run build:seo

      - name: Validate generated release (filesystem and contracts)
        run: |
          npm run test:seo:physical
          npm run test:seo:htaccess
          npm run test:seo:images
          npm run test:seo:package
          node tests/seo_contract_test.mjs
          node tests/seo_release_report_test.mjs

      - name: Install Chromium for hydration checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: npx playwright install --with-deps chromium

      - name: Validate raw generated HTML
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: npm run test:seo:raw

      - name: Run SEO hydration/browser checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: >-
          npx playwright test --config=playwright.seo.config.ts
          tests/seo-browser/prerender.spec.ts
          --grep "refresh, hydration|HTTP route contract|fresh API price|active product remains indexable"

      - name: Generate release report
        run: npm run seo:report

      - name: Build immutable deployment package (no deploy)
        run: |
          npm run seo:package
          npm run seo:validate-package

      - name: Validate extracted immutable package on Linux (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          archive="$(find seo-artifacts -maxdepth 1 -type f -name 'telvora-seo-release-*.tar.gz' -print | sort | head -n 1)"
          test -n "$archive"
          tar -xzf "$archive" -C "$package_dir"
          test -f "$package_dir/tools/pre-activation-layout-check.sh"
          bash "$package_dir/tools/pre-activation-layout-check.sh" "$package_dir"

      - name: Check deployment engine shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n deployment/seo-stage2/deploy-release.sh
          bash -n deployment/seo-stage2/pre-activation-layout-check.sh

      - name: Run deployment engine fixture tests (no deploy)
        env:
          TELVORA_PYTHON: python3
        run: npm run test:seo:deploy

      - name: Fail on obvious secret or private-config material
        shell: bash
        run: |
          set -euo pipefail
          if find dist deployment/seo-stage2 seo-artifacts seo-release -type f \( -name '.env' -o -name 'telvora_secrets.php' -o -name '*credential*' -o -name '*private*' \) -print -quit | grep -q .; then
            echo 'Forbidden secret/private file found in release inputs' >&2
            exit 1
          fi
          if rg -n -i --glob '!*.map' 'BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|DB_PASSWORD|TELEGRAM_BOT_TOKEN|AWS_SECRET_ACCESS_KEY' dist deployment/seo-stage2 seo-artifacts seo-release; then
            echo 'Obvious secret material found in release inputs' >&2
            exit 1
          fi

      - name: Upload immutable SEO artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: telvora-seo-release-${{ github.sha }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            seo-artifacts/telvora-seo-release-*.tar.gz
            seo-artifacts/seo-release-report.json
