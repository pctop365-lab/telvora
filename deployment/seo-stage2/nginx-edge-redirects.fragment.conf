# Minimal fragment for the EXISTING nginx edge vhosts.
# Do not install as a standalone vhost. Keep provider ACME locations and
# existing TLS/certificate directives. Do not touch the Russian redirect domain.

# Existing HTTP vhost(s): retain /.well-known/acme-challenge/ before this.
location / {
    return 301 https://telvora.ru$request_uri;
}

# Existing HTTPS www vhost: certificate must already cover www.telvora.ru.
# Keep the provider's listen/ssl directives; replace only its content routing.
location / {
    return 301 https://telvora.ru$request_uri;
}
